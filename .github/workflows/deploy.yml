name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [forge-rebuild]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: latest
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm run build
        env:
          ENABLE_MULTILANG: 'false'
          FORGE_FAQ_ENABLED: 'true'
          FORGE_REVIEWS_ENABLED: 'false'
          FORGE_ARTICLES_ENABLED: 'true'
          FORGE_URL: ${{ secrets.FORGE_URL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
          PUBLIC_CONTACT_FORM_URL: ${{ secrets.PUBLIC_CONTACT_FORM_URL }}
          PUBLIC_CONTACT_FORM_TOKEN: ${{ secrets.PUBLIC_CONTACT_FORM_TOKEN }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: github.event_name == 'repository_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
